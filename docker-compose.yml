services:
  prop-scraper:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: prop-scraper
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Defaults only — credentials come from .env above, not host substitution.
      MONGODB_DB_NAME: ${MONGODB_DB_NAME:-viewpoint_properties}
      MONGODB_COLLECTION_NAME: ${MONGODB_COLLECTION_NAME:-properties}
      MONGODB_SOLD_COLLECTION_NAME: ${MONGODB_SOLD_COLLECTION_NAME:-sold_properties}
      MONGODB_RECENT_UPDATES_COLLECTION_NAME: ${MONGODB_RECENT_UPDATES_COLLECTION_NAME:-recent_updates}
      SCRAPER_TRANSPORT: ${SCRAPER_TRANSPORT:-api}
      STALE_RECHECK_LIMIT: ${STALE_RECHECK_LIMIT:-25}
    volumes:
      # Mount logs directory to persist logs
      - ./logs:/app/logs
    # Keep container running
    tty: true
    stdin_open: true

